[package]
name = "riverxilee-desktop-lyrics"
version = "1.0.5"
description = "Transparent multi-platform desktop lyrics overlay for Windows"
authors = ["RiverXILee"]
edition = "2024"

[lib]
name = "riverxilee_desktop_lyrics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
futures-lite = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.0"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control"] }
