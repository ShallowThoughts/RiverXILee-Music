[package]
name = "riverxilee-desktop-lyrics"
version = "1.1.3"
description = "Transparent multi-platform desktop lyrics overlay for Windows"
authors = ["RiverXILee"]
edition = "2024"

[lib]
name = "riverxilee_desktop_lyrics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
futures-lite = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = { version = "=2.6.0", default-features = false }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.0"
tauri-plugin-single-instance = "=2.4.0"
tokio = { version = "1", features = ["time"] }
windows = { version = "0.62.2", features = [
  "Foundation",
  "Win32_Graphics_DirectWrite",
  "Media_Control",
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control"] }
